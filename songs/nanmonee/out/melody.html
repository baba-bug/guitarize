<script src="../../../tools/alphatab/node_modules/@coderline/alphatab/dist/alphaTab.js"></script>
<script>
  const base = "../../../tools/alphatab/node_modules/@coderline/alphatab/dist/";
  const api = new alphaTab.AlphaTabApi(document.getElementById("at"), {
    core: { fontDirectory: base + "font/" },
    player: {
      playerMode: alphaTab.PlayerMode.EnabledSynthesizer,
      soundFont: base + "soundfont/sonivox.sf2",
      scrollElement: document.scrollingElement,
      scrollMode: alphaTab.ScrollMode.Off,   // 翻页自己做（keepInView）：合成音和参考音轨用同一个位置
    },
  });
  // 跟随播放翻页：换到新的一行时，把这一行（连同上面的和弦图）的顶放到吸顶工具栏下面、窗口约 FOLLOW_AT 高处，
  // 下面还看得到下一行。按小节号查 alphaTab 的排版位置，不量光标元素（光标有动画，量出来会差一行）
  const FOLLOW_AT = 0.2;
  let lastRowY = null;
  function keepInView() {
    const mb = api.renderer.boundsLookup && api.renderer.boundsLookup.findMasterBarByIndex(currentBar);
    if (!mb) return;
    const rowY = Math.round(mb.realBounds.y + document.getElementById("at").getBoundingClientRect().top + window.scrollY);
    if (rowY === lastRowY) return;   // 同一行里不动
    lastRowY = rowY;
    const header = document.querySelector("header").getBoundingClientRect().height;
    const at = Math.max(header + 8, window.innerHeight * FOLLOW_AT);
    const top = Math.max(0, rowY - at);   // 跳得远（点了别的小节）直接到位，逐行往下时平滑滚
    window.scrollTo({ top, behavior: Math.abs(top - window.scrollY) > window.innerHeight ? "auto" : "smooth" });
  }
  // 正在播放（合成音或参考音轨）时每 150 毫秒看一眼当前小节在哪一行，换行了才翻
  setInterval(() => {
    const synth = api.playerState === alphaTab.synth.PlayerState.Playing;
    const ref = refs.some((r) => r.audio && !r.audio.paused);
    if (synth || ref) keepInView(); else lastRowY = null;
  }, 150);
  const status = document.getElementById("status");
  if (location.protocol === "file:") {   // 直接双击打开的文件：浏览器不让读字体 / 音色库，谱子出不来
    const m = location.pathname.match(/\/songs\/.*$/);
    document.body.insertAdjacentHTML("afterbegin", '<div style="padding:12px 16px;background:#fde7dc;color:#7c2d12;' +
      'border-bottom:1px solid #f4b8a0">这个页面要通过本地服务打开，直接打开文件时浏览器不让加载乐谱字体和音色。' +
      '请双击仓库里的「打开谱子.command」，或在终端运行 <code>python -m guitarize serve --port 8766</code>，然后打开 ' +
      '<a href="http://localhost:8766' + (m ? m[0] : "/") + location.hash + '">http://localhost:8766' + (m ? m[0] : "/") + '</a></div>');
  }
  const playBtn = document.getElementById("play");
  let currentBar = 0;
  // 参考音频（原曲、人声、吉他、贝斯、鼓……）：下拉选一轨，从当前小节播放；同一时间只放一个
  const refSel = document.getElementById("ref");
  const refBtn = document.getElementById("refplay");
  const IDLE = "▶ 从当前小节播放";
  const refs = window.REF_AUDIO.map((r, i) => {
    refSel.add(new Option(r.label, String(i)));
    return { audio: null, url: r.url, label: r.label };
  });
  const audioOf = (r) => { if (!r.audio) { r.audio = new Audio(r.url); r.audio.preload = "auto"; } return r.audio; };
  const stopRefs = () => { refs.forEach((r) => r.audio && r.audio.pause()); refBtn.textContent = IDLE; };
  refSel.value = String(Math.min(window.REF_DEFAULT, refs.length - 1));   // 旋律 / 卡祖笛默认对照主唱
  refSel.onchange = stopRefs;

  api.tex(document.getElementById("tex").textContent);
  api.playerReady.on(() => {
    playBtn.disabled = false;
    status.textContent = "就绪：点音符选定小节，拖选可设置循环区";
  });
  api.error.on((e) => { status.textContent = "出错：" + e.message; });
  // 参考音频正在放时点谱面：音频跳到点中的那一拍（按原曲小节起止时间换算），光标随之跳过去
  const playingRef = () => refs.find((r) => r.audio && !r.audio.paused);
  function timeOfBeat(beat) {
    const bt = window.BAR_TIMES[Math.min(beat.voice.bar.index, window.BAR_TIMES.length - 1)];
    const frac = beat.playbackStart / beat.voice.bar.masterBar.calculateDuration();
    return Math.max(0, bt[0] + Math.min(1, Math.max(0, frac)) * (bt[1] - bt[0]));
  }
  window.__timeOfBeat = timeOfBeat;   // 自检用
  api.beatMouseDown.on((beat) => {
    currentBar = beat.voice.bar.index;
    const r = playingRef();
    if (r && window.BAR_TIMES.length) r.audio.currentTime = timeOfBeat(beat);
  });
  api.playedBeatChanged.on((beat) => { currentBar = beat.voice.bar.index; });

  playBtn.onclick = () => { stopRefs(); api.playPause(); };
  document.getElementById("speed").onchange = (e) => {
    const v = parseFloat(e.target.value);
    api.playbackSpeed = v;
    refs.forEach((r) => { if (r.audio) r.audio.playbackRate = v; });
  };
  document.getElementById("metro").onchange = (e) => { api.metronomeVolume = e.target.checked ? 1 : 0; };
  document.getElementById("loop").onchange = (e) => { api.isLooping = e.target.checked; };

  if (!window.BAR_TIMES.length) {
    refBtn.disabled = true;
    refBtn.title = "缺少原曲小节时间（leadsheet.json）";
  }
  // 参考音频播放时让谱面光标跟着走：按原曲小节起止时间换算成小节内比例 → alphaTab 的 tick 位置
  function barAt(sec) {
    const bt = window.BAR_TIMES;
    let i = bt.findIndex((b) => sec < b[1]);
    if (i < 0) i = bt.length - 1;
    const [a, e] = bt[i];
    return [i, Math.min(1, Math.max(0, (sec - a) / (e - a)))];
  }
  function tickAt(sec) {
    const [i, frac] = barAt(sec);
    const mb = api.score && api.score.masterBars[i];
    return mb ? Math.round(mb.start + frac * mb.calculateDuration()) : null;
  }
  window.__tickAt = tickAt;   // 自检用
  let follow = 0;
  function followAudio(audio) {
    cancelAnimationFrame(follow);
    let last = 0;
    const step = (now) => {
      if (audio.paused) return;
      if (now - last > 80) {   // 约 12 次 / 秒，足够流畅，不给合成器线程塞太多跳转
        last = now;
        const tick = tickAt(audio.currentTime);
        if (tick !== null) api.tickPosition = tick;
        const bar = barAt(audio.currentTime)[0];
        currentBar = bar;
      }
      follow = requestAnimationFrame(step);
    };
    follow = requestAnimationFrame(step);
  }

  refBtn.onclick = () => {
    const r = refs[Number(refSel.value)];
    const audio = audioOf(r);
    const playing = !audio.paused;
    stopRefs();
    if (playing) return;
    api.pause();
    const t = window.BAR_TIMES[Math.min(currentBar, window.BAR_TIMES.length - 1)];
    audio.playbackRate = api.playbackSpeed;
    audio.currentTime = Math.max(0, t[0]);
    audio.play();
    followAudio(audio);
    refBtn.textContent = "⏸ 停止（" + r.label + "）";
  };
  if (location.hash === "#selftest") {   // 无头浏览器自检：第 5 小节中点 → 写进标题
    api.renderFinished.on(() => {
      const bt = window.BAR_TIMES[4];
      document.title = "selftest " + tickAt((bt[0] + bt[1]) / 2) + " expect " +
        (api.score.masterBars[4].start + api.score.masterBars[4].calculateDuration() / 2);
    });
  }
</script>
